name: E2E Nightly

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: "Synthetic staging frontend URL"
        required: true
      apiUrl:
        description: "Synthetic staging API URL including /api"
        required: true
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      E2E_BASE_URL: ${{ inputs.baseUrl || vars.E2E_BASE_URL }}
      E2E_API_URL: ${{ inputs.apiUrl || vars.E2E_API_URL }}
      E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
      E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
      E2E_OTHER_TENANT_EMAIL: ${{ secrets.E2E_OTHER_TENANT_EMAIL }}
      E2E_OTHER_TENANT_PASSWORD: ${{ secrets.E2E_OTHER_TENANT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Check E2E configuration
        run: node ops/e2e/validate-config.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright critical flows
        id: playwright
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/e2e/e2e-results.json
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          mkdir -p test-results/e2e
          npm run test:e2e -- --reporter=line,html,json

      - name: Verify E2E execution evidence
        if: always() && steps.playwright.outcome != 'skipped'
        env:
          E2E_MIN_EXECUTED_TESTS: "6"
        run: node ops/e2e/verify-report.mjs test-results/e2e/e2e-results.json

      - name: Upload Playwright execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/e2e/e2e-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14

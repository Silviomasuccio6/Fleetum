name: Install Platform Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'RELEASE_PLATFORM_PRODUCTION: separate installation authorization required'
        required: true

permissions:
  contents: read

concurrency:
  group: fleetum-production
  cancel-in-progress: false

jobs:
  install:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE_PLATFORM_PRODUCTION' }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - name: Verify exact CI, prepared images, current main and private evidence before SSH
        id: verified
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_CONFIRM: ${{ inputs.confirm }}
          FLEETUM_PLATFORM_PRODUCTION_TRUSTED_CONTROL_SHA: ${{ vars.FLEETUM_PLATFORM_PRODUCTION_TRUSTED_CONTROL_SHA }}
          FLEETUM_PLATFORM_PRODUCTION_INSTALL_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_INSTALL_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_PROFILE_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_PROFILE_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_BACKUP_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_BACKUP_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_PREFLIGHT_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_PREFLIGHT_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_PREPARED_RUN_ID: ${{ vars.FLEETUM_PLATFORM_PRODUCTION_PREPARED_RUN_ID }}
        with:
          script: |
            try {
              const {resolveInstallation}=await import(`${process.env.GITHUB_WORKSPACE}/ops/platform-production/install.mjs`);
              const request=await resolveInstallation(github,process.env,`${process.env.RUNNER_TEMP}/platform-install-proof`);
              const {writeFileSync}=await import('node:fs');
              writeFileSync(`${process.env.RUNNER_TEMP}/platform-install-request.json`,JSON.stringify(request),{mode:0o600,flag:'wx'});
            } catch {
              core.setFailed('Production control stopped. Preserve the private journal; no automatic retry or rollback.');
            }
      - name: Execute one reviewed production transaction
        uses: actions/github-script@v7
        env:
          INSTALL_CONFIRM: ${{ inputs.confirm }}
          FLEETUM_PLATFORM_PRODUCTION_TRUSTED_CONTROL_SHA: ${{ vars.FLEETUM_PLATFORM_PRODUCTION_TRUSTED_CONTROL_SHA }}
          FLEETUM_PLATFORM_PRODUCTION_INSTALL_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_INSTALL_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_PROFILE_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_PROFILE_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_BACKUP_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_BACKUP_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_PREFLIGHT_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_PREFLIGHT_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_PREPARED_RUN_ID: ${{ vars.FLEETUM_PLATFORM_PRODUCTION_PREPARED_RUN_ID }}
          FLEETUM_PLATFORM_PRODUCTION_HOST: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_HOST }}
          FLEETUM_PLATFORM_PRODUCTION_USER: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_USER }}
          FLEETUM_PLATFORM_PRODUCTION_KNOWN_HOSTS: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_KNOWN_HOSTS }}
          FLEETUM_PLATFORM_PRODUCTION_SSH_KEY: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_SSH_KEY }}
        with:
          script: |
            try {
              const {readFileSync,writeFileSync}=await import('node:fs');
              const {executeInstallation,revalidateInstallation}=await import(`${process.env.GITHUB_WORKSPACE}/ops/platform-production/install.mjs`);
              const request=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/platform-install-request.json`,'utf8'));
              const {data:main}=await github.rest.repos.getCommit({owner:context.repo.owner,repo:context.repo.repo,ref:'main'});
              revalidateInstallation(request,process.env,main.sha,process.env.GITHUB_WORKFLOW_SHA);
              const proof=executeInstallation(request);
              writeFileSync(`${process.env.RUNNER_TEMP}/platform-production-installed.json`,JSON.stringify(proof),{mode:0o600,flag:'wx'});
            } catch {
              core.setFailed('Production control stopped. Preserve the private journal; no automatic retry or rollback.');
            }
      - name: Retain only the installation outcome
        uses: actions/upload-artifact@v4
        with:
          name: platform-production-installed-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-production-installed.json
          if-no-files-found: error
          retention-days: 30

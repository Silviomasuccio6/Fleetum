name: Complete Platform Production Frontend

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'COMPLETE_PLATFORM_FRONTEND: one frontend completion, no backend/database lifecycle'
        required: true

permissions:
  contents: read

concurrency:
  group: fleetum-production
  cancel-in-progress: false

jobs:
  complete:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'COMPLETE_PLATFORM_FRONTEND' }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - name: Verify original application and new controller provenance before SSH
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETE_CONFIRM: ${{ inputs.confirm }}
          FLEETUM_PLATFORM_FRONTEND_TRUSTED_CONTROL_SHA: ${{ vars.FLEETUM_PLATFORM_FRONTEND_TRUSTED_CONTROL_SHA }}
          FLEETUM_PLATFORM_FRONTEND_COMPLETION_JSON: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_COMPLETION_JSON }}
          FLEETUM_PLATFORM_FRONTEND_ORIGINAL_REQUEST_JSON: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_ORIGINAL_REQUEST_JSON }}
          FLEETUM_PLATFORM_FRONTEND_CURRENT_STATE_JSON: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_CURRENT_STATE_JSON }}
        with:
          script: |
            try {
              const {resolveCompletion}=await import(`${process.env.GITHUB_WORKSPACE}/ops/platform-production/frontend-completion.mjs`);
              const request=await resolveCompletion(github,process.env,`${process.env.RUNNER_TEMP}/platform-frontend-proof`);
              const {writeFileSync}=await import('node:fs');
              writeFileSync(`${process.env.RUNNER_TEMP}/platform-frontend-request.json`,JSON.stringify(request),{mode:0o600,flag:'wx'});
            } catch {
              core.setFailed('Frontend verification stopped before SSH. No installation or automatic retry.');
            }
      - name: Complete only the frontend with at most one compatible visual fallback
        uses: actions/github-script@v7
        env:
          COMPLETE_CONFIRM: ${{ inputs.confirm }}
          FLEETUM_PLATFORM_FRONTEND_TRUSTED_CONTROL_SHA: ${{ vars.FLEETUM_PLATFORM_FRONTEND_TRUSTED_CONTROL_SHA }}
          FLEETUM_PLATFORM_FRONTEND_COMPLETION_JSON: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_COMPLETION_JSON }}
          FLEETUM_PLATFORM_FRONTEND_ORIGINAL_REQUEST_JSON: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_ORIGINAL_REQUEST_JSON }}
          FLEETUM_PLATFORM_FRONTEND_CURRENT_STATE_JSON: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_CURRENT_STATE_JSON }}
          FLEETUM_PLATFORM_FRONTEND_HOST: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_HOST }}
          FLEETUM_PLATFORM_FRONTEND_USER: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_USER }}
          FLEETUM_PLATFORM_FRONTEND_KNOWN_HOSTS: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_KNOWN_HOSTS }}
          FLEETUM_PLATFORM_FRONTEND_SSH_KEY: ${{ secrets.FLEETUM_PLATFORM_FRONTEND_SSH_KEY }}
        with:
          script: |
            try {
              const {readFileSync,writeFileSync}=await import('node:fs');
              const {executeCompletion,revalidateCompletion}=await import(`${process.env.GITHUB_WORKSPACE}/ops/platform-production/frontend-completion.mjs`);
              const request=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/platform-frontend-request.json`,'utf8'));
              const {data:main}=await github.rest.repos.getCommit({owner:context.repo.owner,repo:context.repo.repo,ref:'main'});
              revalidateCompletion(request,process.env,main.sha,process.env.GITHUB_WORKFLOW_SHA);
              const proof=executeCompletion(request);
              writeFileSync(`${process.env.RUNNER_TEMP}/platform-frontend-completed.json`,JSON.stringify(proof),{mode:0o600,flag:'wx'});
              if(proof.outcome==='fallback')core.warning('Compatible visual fallback installed; Satinata acceptance remains open.');
            } catch {
              core.setFailed('Frontend completion stopped. Preserve the private journal; no backend/database repair or automatic retry.');
            }
      - name: Retain only the completion outcome
        uses: actions/upload-artifact@v4
        with:
          name: platform-frontend-completed-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-frontend-completed.json
          if-no-files-found: error
          retention-days: 30

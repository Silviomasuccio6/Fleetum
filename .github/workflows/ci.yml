name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      previousReleaseSha:
        description: "Full SHA of the approved previous release for migration compatibility"
        required: true

env:
  CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CI_SOURCE_SHA"

      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-git --redact --verbose

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CI_SOURCE_SHA"

      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install semgrep

      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --metrics=off \
            --error \
            --severity ERROR \
            --sarif \
            --output semgrep.sarif \
            .

      - name: Ensure SARIF exists
        if: always()
        run: |
          if [ ! -s semgrep.sarif ]; then
            printf '%s\n' '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Semgrep","informationUri":"https://semgrep.dev","rules":[]}},"results":[]}]}' > semgrep.sarif
          fi

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  verify:
    name: Lint, Build, Test, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CI_SOURCE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Backend tests
        env:
          NODE_ENV: test
          DOTENV_CONFIG_PATH: /dev/null
        run: npm run test -w backend

      - name: Frontend tests
        run: npx tsx --test frontend/tests/*.test.ts

      - name: Marketing website static export tests
        run: npm run test:website

      - name: Public SEO artifacts smoke
        run: |
          test -f frontend/public/robots.txt
          test -f frontend/public/sitemap.xml
          test -f frontend/public/llms.txt
          test -f frontend/public/brand/fleetum-social-preview.png
          grep -q "fleetum.it/demo" frontend/public/sitemap.xml
          npm run verify:prerender -w frontend
          test -f website/out/index.html
          test -f website/out/demo/index.html
          test -f website/out/robots.txt
          test -f website/out/sitemap.xml
          grep -q "fleetum.it/demo" website/out/sitemap.xml

      - name: Validate Caddy routing
        run: |
          docker run --rm \
            -e CADDY_EMAIL=ci@example.invalid \
            -v "${{ github.workspace }}/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Operations safety tests
        run: npm run test:operations

      - name: Production dependency audit
        run: npm run audit:production

  tenant-isolation:
    name: Tenant Isolation HTTP Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleetum
          POSTGRES_PASSWORD: fleetum_dev
          POSTGRES_DB: fleetum_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fleetum -d fleetum_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      RUN_TENANT_ISOLATION_TESTS: "1"
      DOTENV_CONFIG_PATH: /dev/null
      DATABASE_URL: postgresql://fleetum:fleetum_dev@localhost:5433/fleetum_ci?schema=public
      JWT_SECRET: test-jwt-secret-for-ci-only-0000000000000000
      PLATFORM_JWT_SECRET: test-platform-jwt-secret-for-ci-only-000000000000000000000000000000000000000000
      PLATFORM_ADMIN_PASSWORD_HASH: $2a$12$1kW0dHz8CuORBMdsqDk9Z.HEJFh/IofTBgmMuBA43F8VUoCgX0Bde
      PLATFORM_ADMIN_EMAIL: ci-admin@example.local
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM: Fleetum <onboarding@resend.dev>
      STORAGE_PROVIDER: local
      UPLOAD_DIR: uploads-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CI_SOURCE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema backend/prisma/schema.prisma

      - name: Reconcile exact monetary columns
        run: npm run money:reconcile -w backend

      - name: Verify exact monetary dual-write triggers
        run: npm run money:verify-dual-write -w backend

      - name: Run black-box tenant isolation tests
        run: npm run test:tenant-isolation -w backend

  migration-compatibility:
    name: Previous Release / Migrated Schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIOUS_RELEASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && inputs.previousReleaseSha || github.event.before) }}

    steps:
      - name: Checkout complete release history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CI_SOURCE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Validate manual previous-release SHA
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! [[ "$PREVIOUS_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Manual CI requires the approved previous release full SHA."
            exit 1
          fi

      - name: Install candidate dependencies
        run: npm ci

      - name: Verify migration and previous-release compatibility
        run: npm run verify:migration-compatibility

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CI_SOURCE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build marketing website
        env:
          NEXT_PUBLIC_API_URL: https://api.fleetum.it/api
          NEXT_PUBLIC_SITE_URL: https://fleetum.it
          NEXT_PUBLIC_APP_LOGIN_URL: https://fleetum.it/login
          NEXT_PUBLIC_SITE_INDEXABLE: "true"
        run: npm run build -w website

      - name: Verify production indexing contract
        run: |
          npm run test:website
          grep -q '<meta name="robots" content="index, follow"' website/out/index.html
          grep -q 'Sitemap: https://fleetum.it/sitemap.xml' website/out/robots.txt
          if grep -q 'Disallow: /' website/out/robots.txt; then
            echo "Production website export unexpectedly blocks crawling."
            exit 1
          fi

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  source-attestation:
    name: CI source attestation
    needs: [secret-scan, sast, verify, tenant-isolation, migration-compatibility, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify immutable checkout and write source proof
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CI_SOURCE_SHA"
          export CI_ACTUAL_SHA="$ACTUAL_SHA"
          node ops/ci-release-identity.mjs write .ci-proof/ci-source.json
      - name: Publish CI source proof
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-proof-${{ github.run_id }}
          path: .ci-proof/ci-source.json
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

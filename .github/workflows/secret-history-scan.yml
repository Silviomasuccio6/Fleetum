name: Secret History Scan

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to scan"
        required: false
        default: "main"
      fail_on_findings:
        description: "Fail the workflow when unbaselined findings are detected"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history (manual ref)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout full history (scheduled)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Scan an arbitrary requested ref, but validate its result with the exact
      # workflow revision. Historical scan refs need not contain this helper.
      - name: Checkout trusted evidence controls
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .scan-controls
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ops/security/scan-evidence.mjs
            /.node-version

      - name: Setup Node.js for scan evidence
        uses: actions/setup-node@v6
        with:
          node-version-file: ".scan-controls/.node-version"

      - name: Fetch all remote branches and tags
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Run Gitleaks on full history
        id: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          commits="$(git rev-list --all --count)"
          test "$commits" -gt 0
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -m 700 "$RUNNER_TEMP/gitleaks-history"
          set +e

          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "$RUNNER_TEMP/gitleaks-history:/reports" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
              --source /repo \
              --redact \
              --exit-code 10 \
              --log-opts="--all" \
              --report-format sarif \
              --report-path /reports/report.sarif

          status="$?"
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          # Gitleaks exit 1 is ambiguous (findings OR errors) without an explicit
          # finding exit code. Retain non-blocking legacy triage only for 10.
          case "$status" in
            0|10) exit 0 ;;
            *) echo "Secret history scanner failed; analysis incomplete." >&2; exit 1 ;;
          esac

      - name: Validate genuine redacted history evidence
        id: evidence
        if: always()
        env:
          SCAN_EXIT_CODE: ${{ steps.gitleaks.outputs.exit_code }}
          SCANNED_COMMITS: ${{ steps.gitleaks.outputs.commits }}
          SCANNED_SHA: ${{ steps.gitleaks.outputs.checkout_sha }}
        run: |
          report="$RUNNER_TEMP/gitleaks-history/report.sarif"
          trap 'rm -f -- "$report"' EXIT
          validation_status=0
          node .scan-controls/ops/security/scan-evidence.mjs gitleaks "$report" "$SCAN_EXIT_CODE" > "$RUNNER_TEMP/gitleaks-evidence.json" || validation_status=$?
          node --input-type=module -e '
            import fs from "node:fs";
            const s=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/gitleaks-evidence.json`));
            const checkoutSha = process.env.SCANNED_SHA;
            const reachableCommits = Number(process.env.SCANNED_COMMITS);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Secret history execution: ${s.status}; reason: ${s.reason ?? "none"}; findings: ${s.findingsCount}; reachable commits: ${reachableCommits}; checkout: ${checkoutSha}. Findings require private triage even when this workflow is non-blocking.\n`);

            if (s.reportValid) {
              if (!/^[a-f0-9]{40}$/.test(checkoutSha) ||
                  !Number.isSafeInteger(reachableCommits) || reachableCommits <= 0) {
                throw new Error("Invalid scan scope metadata");
              }
              const summary = {
                schemaVersion: 1,
                scanner: s.scanner,
                status: s.status,
                findingsCount: s.findingsCount,
                rulesCount: s.rulesCount,
                warningCount: s.warningCount,
                checkoutSha,
                reachableCommits
              };
              fs.writeFileSync(`${process.env.RUNNER_TEMP}/gitleaks-history-summary.json`, JSON.stringify(summary, null, 2) + "\n");
            }
          '
          exit "$validation_status"

      - name: Upload aggregate Gitleaks history summary
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-summary
          path: ${{ runner.temp }}/gitleaks-history-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce manual failure on findings
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.fail_on_findings == 'true' &&
          steps.gitleaks.outputs.exit_code == '10'
        run: |
          echo "Gitleaks found unbaselined history findings and fail_on_findings=true was selected."
          exit 1

name: Prepare Platform Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'PREPARE_PLATFORM_PRODUCTION: publish verified images only, no installation'
        required: true

permissions:
  contents: read

concurrency:
  group: fleetum-platform-production-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'PREPARE_PLATFORM_PRODUCTION' }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      PREPARE_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - name: Resolve exact successful main evidence and verify every artifact
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          FLEETUM_PLATFORM_PRODUCTION_TRUSTED_CONTROL_SHA: ${{ vars.FLEETUM_PLATFORM_PRODUCTION_TRUSTED_CONTROL_SHA }}
          FLEETUM_PLATFORM_PRODUCTION_PREPARE_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_PREPARE_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_PROFILE_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_PROFILE_JSON }}
        with:
          script: |
            try {
              const {resolve}=await import(`${process.env.GITHUB_WORKSPACE}/ops/platform-production/prepare.mjs`);
              const result=await resolve(github,process.env,`${process.env.RUNNER_TEMP}/platform-production-prepare`);
              core.info(`Verified source: ${result.controlSha}; server access: false`);
            } catch {
              core.setFailed('Protected evidence validation failed. No image publication or installation attempted.');
            }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare tested backend and both preserving frontend overlays
        env:
          GH_TOKEN: ${{ github.token }}
          FLEETUM_PLATFORM_PRODUCTION_TRUSTED_CONTROL_SHA: ${{ vars.FLEETUM_PLATFORM_PRODUCTION_TRUSTED_CONTROL_SHA }}
          FLEETUM_PLATFORM_PRODUCTION_PREPARE_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_PREPARE_JSON }}
          FLEETUM_PLATFORM_PRODUCTION_PROFILE_JSON: ${{ secrets.FLEETUM_PLATFORM_PRODUCTION_PROFILE_JSON }}
        run: node ops/platform-production/prepare.mjs build "$RUNNER_TEMP/platform-production-prepare"
      - name: Publish review metadata only
        uses: actions/upload-artifact@v4
        with:
          name: platform-production-prepared-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/platform-production-prepare/prepared/prepared-production.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish both overlay manifests separately
        uses: actions/upload-artifact@v4
        with:
          name: platform-production-manifests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/platform-production-prepare/prepared/satin/manifest.json
            ${{ runner.temp }}/platform-production-prepare/prepared/fallback/manifest.json
          if-no-files-found: error
          retention-days: 30

name: fleetum-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetum_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetum_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: fleetum_staging
    volumes:
      - /opt/fleetum-staging/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetum_staging -d fleetum_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fleetum_staging_private

  backend:
    image: ${FLEETUM_BACKEND_IMAGE:?FLEETUM_BACKEND_IMAGE must be an immutable GHCR digest reference}
    container_name: fleetum_staging_backend
    restart: unless-stopped
    env_file:
      # Bcrypt hashes contain `$`; raw keeps them intact instead of interpolating them.
      - path: /opt/fleetum-staging/env/backend.env
        required: true
        format: raw
    # Literal overrides win over backend.env and keep this manifest fail-closed.
    environment:
      FLEETUM_ENVIRONMENT: staging
      EMAIL_PROVIDER: disabled
      BILLING_DUNNING_CRON_ENABLED: "false"
      PRIVACY_RETENTION_CRON_ENABLED: "false"
      PRIVACY_RETENTION_GLOBAL_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/fleetum-staging/uploads:/app/backend/uploads
      - /opt/fleetum-staging/logs:/app/logs
    expose:
      - "4000"
      - "4100"
    networks:
      - fleetum_staging_private

  caddy:
    image: ${FLEETUM_FRONTEND_IMAGE:?FLEETUM_FRONTEND_IMAGE must be an immutable GHCR digest reference}
    container_name: fleetum_staging_caddy
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    networks:
      - fleetum_staging_private
      - fleetum_staging_edge

networks:
  fleetum_staging_private:
    name: fleetum_staging_private
    internal: true
    driver: bridge
  fleetum_staging_edge:
    name: fleetum_staging_edge
    driver: bridge

volumes:
  staging_caddy_data:
  staging_caddy_config:
